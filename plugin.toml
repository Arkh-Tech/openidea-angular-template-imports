id = "arkhtech.angular-template-imports"
name = "Angular Template Imports"
version = "0.3.5"

description = "Smart Angular Quick Fixes and automatic imports for OpenIDEA"

authors = ["Arkh-Tech"]
homepage = "https://github.com/Arkh-Tech/openidea-angular-template-imports"
license = "MIT"

categories = ["frameworks", "tools"]
engines.openidea = "^1.3"
wasm = "dist/plugin.wasm"
activation = ["on-language:html"]


change-notes = """
Added multiple import options for Angular directives and pipes.
Added an interactive import selection dialog.
Improved detection of re-exported symbols and aliases.
Fixed RouterLink and RouterLinkWithHref resolution.
Added optional test/testing imports with clear labels.
Preserved duplicate import prevention and import ordering.
"""


[capabilities]
required = ["project.read"]

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["html"]


