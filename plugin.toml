id = "arkhtech.angular-template-imports"
name = "Angular Template Imports"
version = "0.3.4"

description = "Smart Angular Quick Fixes and automatic imports for OpenIDEA"

authors = ["Arkh-Tech"]
homepage = "https://github.com/Arkh-Tech/openidea-angular-template-imports"
license = "MIT"

categories = ["frameworks", "tools"]
engines.openidea = "^1.3"
wasm = "dist/plugin.wasm"
activation = ["on-language:html"]


change-notes = """
Improved Angular directive and pipe dependency resolution.
Filtered testing-related packages and test files from new suggestions.
Inserted TypeScript imports after existing imports.
Added regression tests for import ordering and filtering.
"""


[capabilities]
required = ["project.read"]

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["html"]


